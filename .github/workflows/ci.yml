name: CI/CD - Build, Push y Deploy en VM

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./servidor/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/picopark-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/picopark-server:${{ github.sha }}

  deploy-vm:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Desplegar nueva imagen en la VM local
        run: |
          cd ~/PicoPark-RoAlba
          docker compose pull
          docker compose up -d
          docker image prune -f
