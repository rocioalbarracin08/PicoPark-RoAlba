name: CI - Build y Push a Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga tu código fuente en la compu virtual de GitHub
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      # 2. Inicia sesión en Docker Hub usando tus Secrets
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Construye la imagen desde ./servidor/Dockerfile y la sube a Docker Hub
      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: ./servidor
          file: ./servidor/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/picopark-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/picopark-server:${{ github.sha }}
